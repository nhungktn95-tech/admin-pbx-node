# pbx-node: một cụm tổng đài = Asterisk + PostgreSQL (Realtime DB).
# Không chạy code nghiệp vụ. PBX Gateway (repo riêng) chỉ kết nối AMI 5038 + ARI 8088 (không dùng DB của cụm).
# Giới hạn log của Docker (docker logs) cho mọi service: tối đa 5 file x 20 MB / service, cũ tự xóa.
# Không có mục này Docker giữ log mãi -> ổ đĩa đầy dần, nhất là khi tải cao (Asterisk ghi mỗi bước dialplan).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    build: ./db                  # postgres:16 + tzdata-legacy (xem db/Dockerfile)
    image: pbx-db:16
    container_name: pbx-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      GW_DB_USER: ${GW_DB_USER}           # user riêng cho PBX Gateway (db/init/03-gateway-user.sh)
      GW_DB_PASSWORD: ${GW_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro   # chỉ chạy ở lần khởi động đầu tiên
      - pgdata:/var/lib/postgresql/data
    ports:
      # Chỉ cho quản trị viên (Gateway không dùng nữa). Firewall chặn từ ngoài.
      - "${ADMIN_BIND:-0.0.0.0}:5432:5432"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  asterisk:
    build: ./asterisk
    image: pbx-asterisk:20
    container_name: pbx-asterisk
    # Hostname cố định, bắt đầu bằng chữ cái. Asterisk dùng hostname làm tên miền trong From/Contact khi gửi qua
    # WebSocket; Docker mặc định đặt hostname = mã container (vd 480a5ff399f6), bắt đầu bằng chữ số là sai chuẩn SIP
    # -> JsSIP bỏ gói -> máy web đăng ký được nhưng Unavail, không nhận được cuộc gọi.
    hostname: pbx-asterisk
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    logging: *default-logging
    # Số file/socket Asterisk được mở cùng lúc. Mỗi kênh cần nhiều (RTP, RTCP, file ghi âm, timer...).
    # Mặc định của Docker có thể chỉ 1024 -> "Too many open files" ở khoảng 100-200 cuộc gọi.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "5060:5060/udp"                                           # SIP: softphone, Media AI, nhà mạng
      - "5060:5060/tcp"                                           # SIP qua TCP (ổn định hơn qua NAT)
      - "5061:5061/tcp"                                           # SIP qua TLS (mã hóa báo hiệu)
      - "${RTP_START}-${RTP_END}:${RTP_START}-${RTP_END}/udp"     # RTP: âm thanh
      - "8089:8089"                                               # WSS: Softphone SDK trong trình duyệt
      - "${ADMIN_BIND:-0.0.0.0}:5038:5038"                        # AMI: chỉ cho Gateway
      - "${ADMIN_BIND:-0.0.0.0}:8088:8088"                        # ARI: chỉ cho Gateway
    volumes:
      - ./asterisk/conf:/opt/pbx-conf:ro   # sửa cấu hình xong chỉ cần: docker compose restart asterisk
      - astkeys:/etc/asterisk/keys         # chứng chỉ TLS cho WSS (tự tạo lần đầu)
      - astlogs:/var/log/asterisk
      - astdb:/var/lib/asterisk/astdb      # máy lẻ PJSIP (astdb.sqlite3) — PHẢI sao lưu
      - astconf:/etc/asterisk/gateway      # group (queues-groups.conf, Gateway sửa qua AMI UpdateConfig) — PHẢI sao lưu
      # File ghi âm. Mặc định volume "recordings". Đặt RECORDINGS_PATH trong .env = đường dẫn trên máy chủ
      # (vd /data/recordings, nên là ổ riêng) để ghi âm đầy ổ không kéo theo DB, astdb, log.
      - ${RECORDINGS_PATH:-recordings}:/var/spool/asterisk/recording

volumes:
  pgdata:
  astkeys:
  astlogs:
  astdb:
  astconf:
  recordings:
