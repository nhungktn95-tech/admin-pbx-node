; Máy lẻ PJSIP (endpoint, auth, aor) lưu trong astdb của Asterisk (SQLite: /var/lib/asterisk/astdb/astdb.sqlite3,
; volume "astdb"). PBX Gateway tạo/sửa/xóa qua ARI Push Configuration:
;   PUT/DELETE /ari/asterisk/config/dynamic/res_pjsip/{endpoint|auth|aor}/{số}
; Có hiệu lực ngay, không reload. Gateway không cần biết database của cụm.
;
; Không dùng realtime (PostgreSQL) cho 3 loại này: khi ghi qua ARI, Asterisk 20 INSERT mọi thuộc tính mà
; không đặt tên cột trong nháy kép → cột "100rel" của endpoint làm PostgreSQL báo lỗi cú pháp (cả res_config_odbc
; lẫn res_config_pgsql). Máy lẻ cũ trong ps_*: chuyển một lần bằng scripts/chuyen-may-le-sang-astdb.sh.
[res_pjsip]
endpoint = astdb,pjsip
auth     = astdb,pjsip
aor      = astdb,pjsip
