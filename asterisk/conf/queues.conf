; Group (queue). Từ Bước G3 group KHÔNG còn trong database: mỗi group là một mục [6xx] trong
; /etc/asterisk/gateway/queues-groups.conf (volume astconf) — PBX Gateway sửa file đó qua AMI UpdateConfig + QueueReload.
; File này chỉ giữ cấu hình chung, chép đè mỗi lần khởi động.
; Không dùng symlink: AMI chặn GetConfig/UpdateConfig với file có đường dẫn thật nằm ngoài /etc/asterisk.
[general]
persistentmembers = no
monitor-type = MixMonitor

#include gateway/queues-groups.conf
