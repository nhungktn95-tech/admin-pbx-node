; Gửi mỗi bản ghi CDR thành sự kiện AMI "Cdr" (quyền đọc "cdr" của user Gateway trong manager.conf).
; PBX Gateway nhận sự kiện này để lưu lịch sử cuộc gọi — Gateway không đọc bảng cdr.
; Lúc Gateway mất kết nối AMI thì không nhận lại được các CDR trong khoảng đó (bảng cdr vẫn có đủ).
[general]
enabled = yes

; Thêm trường vào sự kiện: biến CDR => tên header
[mappings]
linkedid => LinkedID
sequence => Sequence
recordingfile => RecordingFile
