; Group (queue) do PBX Gateway quản lý qua AMI UpdateConfig. Đây là BẢN MẪU: entrypoint chỉ chép vào volume astconf
; (/etc/asterisk/gateway/queues-groups.conf) khi volume còn trống. Sửa file mẫu này KHÔNG ảnh hưởng cụm đang chạy.
; Thứ tự dòng "member =>" là thứ tự đổ chuông khi strategy = linear / rrordered. Cú pháp:
;   member => PJSIP/<số>,<penalty>,<tên>,PJSIP/<số>

; Group 600 mẫu: đổ chuông tất cả thành viên cùng lúc, mỗi lượt 20 giây
[600]
strategy = ringall
timeout = 20
retry = 2
wrapuptime = 0
ringinuse = no
joinempty = yes
leavewhenempty = no
member => PJSIP/101,0,Nhan vien 101,PJSIP/101
member => PJSIP/102,0,Nhan vien 102,PJSIP/102
