; ============================================================
; Dialplan - quy ước số: 1xx người thật, 2xx AI, 6xx group
; ============================================================
[general]
static = yes
writeprotect = no

[globals]

; Mọi máy lẻ dùng context này (cột "context" trong ps_endpoints)
[from-internal]
; Gọi máy lẻ người thật hoặc AI
exten => _[12]XX,1,NoOp(Goi may le ${EXTEN} tu ${CALLERID(num)})
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,NoOp(Ket qua: ${DIALSTATUS})
 same => n,Hangup()

; Gọi vào group (queue): đổ chuông các thành viên
exten => _6XX,1,NoOp(Goi group ${EXTEN})
 same => n,Answer()
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Queue(${EXTEN},,,,60)
 same => n,NoOp(Ket qua queue: ${QUEUESTATUS})
 same => n,Hangup()

; *43: thử âm thanh - nói gì nghe lại nấy (kiểm tra RTP/âm thanh)
exten => *43,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; *44: thử phím bấm (DTMF) - nghe bíp, bấm số, kết thúc bằng #; Asterisk đọc lại các số vừa bấm.
; Im lặng 10 giây rồi cúp = Asterisk không nhận được phím (softphone chưa gửi RFC 2833/4733).
exten => *44,1,Answer()
 same => n,Read(SO,beep,0,,1,10)
 same => n,NoOp(DTMF nhan duoc: ${SO})
 same => n,SayDigits(${SO})
 same => n,Hangup()

; ------------------------------------------------------------
; Ghi âm cuộc gọi. Gọi bằng Gosub(sub-record,s,1(<số bị gọi>)) ngay trước Dial/Queue.
;   - Tắt bằng RECORD_CALLS=no trong .env (mặc định: ghi).
;   - Lưu ở /var/spool/asterisk/recording = thư mục ghi âm của ARI, nên Gateway
;     liệt kê/tải/xóa được qua ARI: GET /ari/recordings/stored/<tên>/file
;   - Tên file (không có đuôi .wav) ghi vào cột cdr.recordingfile.
;   - MixMonitor tùy chọn b: chỉ ghi khi 2 bên đã nối máy. Cuộc gọi không ai nghe
;     chỉ tạo file rỗng (44 byte) -> [sub-record-end] xóa file và xóa tên trong cdr.
; ------------------------------------------------------------
[sub-record]
exten => s,1,GotoIf($["${ENV(RECORD_CALLS)}" = "no"]?done)
 same => n,GotoIf($["${CDR(recordingfile)}" != ""]?done)   ; kênh này đang được ghi rồi
 same => n,Set(REC_NAME=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_${FILTER(0-9A-Za-z+,${CALLERID(num)})}_${FILTER(0-9A-Za-z,${ARG1})}_${UNIQUEID})
 same => n,Set(CDR(recordingfile)=${REC_NAME})
 same => n,Set(CHANNEL(hangup_handler_push)=sub-record-end,s,1)
 same => n,MixMonitor(/var/spool/asterisk/recording/${REC_NAME}.wav,b)
 same => n(done),Return()

; Chạy khi kênh gác máy: file chỉ có phần đầu WAV (không có tiếng) thì xóa
[sub-record-end]
exten => s,1,Set(REC_FILE=/var/spool/asterisk/recording/${REC_NAME}.wav)
 same => n,GotoIf($[0${STAT(s,${REC_FILE})} > 44]?done)
 same => n,System(rm -f ${REC_FILE})
 same => n,Set(CDR(recordingfile)=)
 same => n(done),Return()
