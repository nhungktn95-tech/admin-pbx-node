; ============================================================
; Dialplan - định tuyến THEO TRA CỨU, không theo đầu số (21/10/2026, docs/quy-uoc-so.md):
;   Số gọi tới là group (có trong queues-groups.conf)  -> Queue
;   Số gọi tới là IVR (có khóa astdb ivr/<số>/default) -> menu bấm phím (docs/ivr.md)
;   Số gọi tới là máy lẻ (có endpoint PJSIP trong astdb) -> Dial
;   Không phải các loại trên                             -> báo "số không tồn tại"
; Asterisk KHÔNG cần biết dải số: số 3, 4, 5 chữ số đều chạy. Quy ước dải (máy lẻ / group / dành riêng) do PBX Gateway
; kiểm tra khi tạo (cấu hình pbx.numbering.*), mặc định: 1000-5999 máy lẻ, 6000-8999 group, 9000-9999 IVR,
; dải cũ 100-599 / 600-999 vẫn dùng được. Web hay softphone do thuộc tính máy lẻ (webrtc, transport) quyết định.
;   *4x số thử: *43 âm thanh, *44 phím bấm, *45 thử tải · *46<số IVR> ghi lời chào IVR (cần IVR_RECORD_PIN)
; Mỗi số xử lý trong cùng một extension, chỉ nhảy nhãn (GotoIf) bên trong, không Goto sang context khác trước
; Dial/Queue: CDR cập nhật dst/dcontext theo vị trí hiện tại của kênh, nhảy context sẽ làm lịch sử ghi sai số đích.
; Sau này thêm gọi ra ngoài (vd _0X.): mẫu cụ thể hơn được Asterisk ưu tiên trước _X., không đụng tới khối dưới.
; ============================================================
[general]
static = yes
writeprotect = no

[globals]

; Mọi máy lẻ dùng context này (thuộc tính "context" của endpoint)
[from-internal]
; Gọi máy lẻ hoặc group: tra xem số là gì rồi mới quyết định (group ưu tiên nếu lỡ trùng — Gateway chặn trùng)
exten => _X.,1,NoOp(Goi ${EXTEN} tu ${CALLERID(num)})
 same => n,GotoIf($[${QUEUE_EXISTS(${EXTEN})}]?group)
 same => n,GotoIf($[${DB_EXISTS(ivr/${EXTEN}/default)}]?ivr)
 same => n,GotoIf($["${PJSIP_ENDPOINT(${EXTEN},context)}" != ""]?maule)
 ; Không có số này: báo bằng âm thanh sớm (183, KHÔNG nhấc máy) để lịch sử ghi là không thành công.
 ; Log có thêm 1 dòng WARNING "Failed to retrieve information for endpoint" — bình thường.
 same => n,NoOp(So ${EXTEN} khong ton tai)
 same => n,Progress()
 same => n,Playback(ss-noservice,noanswer)
 same => n,Hangup(1)

 ; Máy lẻ
 same => n(maule),NoOp(Goi may le ${EXTEN})
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,NoOp(Ket qua: ${DIALSTATUS})
 same => n,Hangup()

 ; Group (queue): đổ chuông các thành viên
 same => n(group),NoOp(Goi group ${EXTEN})
 same => n,Answer()
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Queue(${EXTEN},,,,60)
 same => n,NoOp(Ket qua queue: ${QUEUESTATUS})
 same => n,Hangup()

 ; IVR - menu bấm phím (docs/ivr.md). Cấu hình trong astdb, Gateway sửa bằng AMI DBPut/DBDelTree, hiệu lực ngay:
 ;   ivr/<số>/default   (bắt buộc) đích khi không bấm / bấm sai quá số lần nhắc lại; có khóa này = số là IVR
 ;   ivr/<số>/opt/<phím> đích của phím 0-9 hoặc *
 ;   ivr/<số>/prompt    (tùy chọn) đường dẫn file lời chào không đuôi; mặc định /var/lib/asterisk/ivr/<số> (ghi bằng *46<số>)
 ;   ivr/<số>/timeout   giây chờ bấm sau lời chào (mặc định 5) · ivr/<số>/retries số lần nhắc lại (mặc định 2)
 ; Đích = một số (máy lẻ / group / IVR khác) hoặc "hangup". Đi tới đích bằng Goto lại from-internal -> lịch sử (dst) ghi đích
 ; cuối cùng; đường đi IVR (số IVR=phím) ghi vào CDR(userfield), vd "ivr:9000=1;ivr:9001=t".
 same => n(ivr),NoOp(IVR ${EXTEN})
 same => n,Set(IVR_HOPS=$[0${IVR_HOPS} + 1])
 same => n,GotoIf($[${IVR_HOPS} > 5]?ivrloop)            ; IVR trỏ vòng nhau
 same => n,Set(IVR=${EXTEN})
 same => n,Set(IVR_TIMEOUT=5)
 same => n,ExecIf($[${DB_EXISTS(ivr/${IVR}/timeout)}]?Set(IVR_TIMEOUT=${FILTER(0-9,${DB_RESULT})}))
 same => n,Set(IVR_RETRIES=2)
 same => n,ExecIf($[${DB_EXISTS(ivr/${IVR}/retries)}]?Set(IVR_RETRIES=${FILTER(0-9,${DB_RESULT})}))
 same => n,Set(IVR_PROMPT=/var/lib/asterisk/ivr/${IVR})
 same => n,ExecIf($[${DB_EXISTS(ivr/${IVR}/prompt)}]?Set(IVR_PROMPT=${DB_RESULT}))
 ; Chưa ghi lời chào: chỉ phát tiếng bíp (vẫn bấm phím được)
 same => n,ExecIf($["${IVR_PROMPT}" = "/var/lib/asterisk/ivr/${IVR}" & !${STAT(e,${IVR_PROMPT}.wav)}]?Set(IVR_PROMPT=beep))
 same => n,Answer()
 same => n,Set(IVR_TRY=0)
 same => n(ivrmenu),Set(IVR_TRY=$[${IVR_TRY} + 1])
 same => n,Read(IVR_KEY,${IVR_PROMPT},1,,1,${IVR_TIMEOUT})
 same => n,GotoIf($["${IVR_KEY}" = ""]?ivrnone)
 same => n,GotoIf($[${DB_EXISTS(ivr/${IVR}/opt/${IVR_KEY})}]?ivrdest)
 same => n,Playback(invalid)                              ; bấm phím không có trong menu
 same => n(ivrnone),GotoIf($[${IVR_TRY} <= ${IVR_RETRIES}]?ivrmenu)
 same => n,Set(IVR_KEY=t)                                 ; hết lượt -> đích mặc định
 same => n,Set(IVR_HAS_DEFAULT=${DB_EXISTS(ivr/${IVR}/default)})   ; nạp đích mặc định vào DB_RESULT cho nhãn ivrdest
 same => n(ivrdest),Set(IVR_DEST=${FILTER(0-9*a-z,${DB_RESULT})})
 same => n,Set(CDR(userfield)=${CDR(userfield)}ivr:${IVR}=${IVR_KEY}\;)   ; \; = dấu ; thật (; trần là chú thích)
 same => n,NoOp(IVR ${IVR}: phim ${IVR_KEY} -> ${IVR_DEST})
 same => n,GotoIf($["${IVR_DEST}" = "hangup" | "${IVR_DEST}" = ""]?ivrbye)
 same => n,Goto(from-internal,${IVR_DEST},1)
 same => n(ivrbye),Playback(vm-goodbye)
 same => n,Hangup()
 same => n(ivrloop),NoOp(IVR lap vong qua ${IVR_HOPS} lan)
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; *43: thử âm thanh - nói gì nghe lại nấy (kiểm tra RTP/âm thanh)
exten => *43,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; *44: thử phím bấm (DTMF) - nghe bíp, bấm số, kết thúc bằng #; Asterisk đọc lại các số vừa bấm.
; Im lặng 10 giây rồi cúp = Asterisk không nhận được phím (softphone chưa gửi RFC 2833/4733).
exten => *44,1,Answer()
 same => n,Read(SO,beep,0,,1,10)
 same => n,NoOp(DTMF nhan duoc: ${SO})
 same => n,SayDigits(${SO})
 same => n,Hangup()

; *45: ĐÍCH THỬ TẢI (scripts/load-test.sh, docs/chiu-tai.md). Nhấc máy, ghi âm, phát nhạc chờ tới khi bên gọi gác máy.
; SIPp phát lại (echo) âm thanh nhận được -> RTP 2 chiều như cuộc gọi thật. Mỗi cuộc thử = 1 kênh (cuộc gọi thật 2 bên
; = 2 kênh). Ghi âm không dùng tùy chọn b (không có bên thứ hai để nối) và file bị xóa khi gác máy để thử tải không làm
; đầy ổ. Nhạc chờ là file WAV nên Asterisk phải chuyển mã -> tốn CPU hơn cuộc gọi thật một chút (kết quả thiên về an toàn).
; Tự cúp sau 10 phút để cuộc thử bị treo không giữ cổng RTP mãi.
exten => *45,1,NoOp(Thu tai tu ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(TIMEOUT(absolute)=600)
 same => n,GotoIf($["${ENV(RECORD_CALLS)}" = "no"]?play)
 same => n,Set(LT_FILE=/var/spool/asterisk/recording/loadtest-${UNIQUEID}.wav)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-loadtest-end,s,1)
 same => n,MixMonitor(${LT_FILE})
 same => n(play),MusicOnHold(default)
 same => n,Hangup()

; *46<số IVR>: ghi lời chào cho IVR qua điện thoại (docs/ivr.md). Cần IVR_RECORD_PIN trong .env (để trống = tắt).
;   Nhập PIN rồi # -> bíp -> nói lời chào -> bấm # (hoặc im lặng 5 giây) để dừng -> nghe lại -> bíp:
;   bấm 1 = lưu (thay lời chào cũ, hiệu lực ngay), 2 = ghi lại, phím khác / không bấm = hủy.
exten => _*46X.,1,NoOp(Ghi loi chao IVR ${EXTEN:3} tu ${CALLERID(num)})
 same => n,Set(IVR=${FILTER(0-9,${EXTEN:3})})
 same => n,GotoIf($["${ENV(IVR_RECORD_PIN)}" = ""]?off)
 same => n,Answer()
 same => n,Authenticate(${ENV(IVR_RECORD_PIN)})
 same => n,Set(NEW=/var/lib/asterisk/ivr/${IVR}-moi)
 same => n(rec),Playback(beep)
 same => n,Record(${NEW}.wav,5,180)
 same => n,Playback(${NEW})
 same => n,Read(OK,beep,1,,1,10)
 same => n,GotoIf($["${OK}" = "1"]?save)
 same => n,GotoIf($["${OK}" = "2"]?rec)
 same => n,System(rm -f ${NEW}.wav)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()
 same => n(save),System(mv -f ${NEW}.wav /var/lib/asterisk/ivr/${IVR}.wav)
 same => n,NoOp(Da luu loi chao IVR ${IVR})
 same => n,Playback(auth-thankyou)
 same => n,Hangup()
 same => n(off),NoOp(Chua dat IVR_RECORD_PIN - tinh nang ghi loi chao dang tat)
 same => n,Playback(ss-noservice,noanswer)
 same => n,Hangup()

; ------------------------------------------------------------
; Ghi âm cuộc gọi. Gọi bằng Gosub(sub-record,s,1(<số bị gọi>)) ngay trước Dial/Queue.
;   - Tắt bằng RECORD_CALLS=no trong .env (mặc định: ghi).
;   - Lưu ở /var/spool/asterisk/recording = thư mục ghi âm của ARI, nên Gateway
;     liệt kê/tải/xóa được qua ARI: GET /ari/recordings/stored/<tên>/file
;   - Tên file (không có đuôi .wav) ghi vào cột cdr.recordingfile.
;   - MixMonitor tùy chọn b: chỉ ghi khi 2 bên đã nối máy. Cuộc gọi không ai nghe
;     chỉ tạo file rỗng (44 byte) -> [sub-record-end] xóa file và xóa tên trong cdr.
; ------------------------------------------------------------
[sub-record]
exten => s,1,GotoIf($["${ENV(RECORD_CALLS)}" = "no"]?done)
 same => n,GotoIf($["${CDR(recordingfile)}" != ""]?done)   ; kênh này đang được ghi rồi
 same => n,Set(REC_NAME=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_${FILTER(0-9A-Za-z+,${CALLERID(num)})}_${FILTER(0-9A-Za-z,${ARG1})}_${UNIQUEID})
 same => n,Set(CDR(recordingfile)=${REC_NAME})
 same => n,Set(CHANNEL(hangup_handler_push)=sub-record-end,s,1)
 same => n,MixMonitor(/var/spool/asterisk/recording/${REC_NAME}.wav,b)
 same => n(done),Return()

; Chạy khi kênh gác máy: file chỉ có phần đầu WAV (không có tiếng) thì xóa
[sub-record-end]
exten => s,1,Set(REC_FILE=/var/spool/asterisk/recording/${REC_NAME}.wav)
 same => n,GotoIf($[0${STAT(s,${REC_FILE})} > 44]?done)
 same => n,System(rm -f ${REC_FILE})
 same => n,Set(CDR(recordingfile)=)
 same => n(done),Return()

; Gác máy cuộc thử tải *45: xóa file ghi âm thử
[sub-loadtest-end]
exten => s,1,System(rm -f ${LT_FILE})
 same => n,Return()
