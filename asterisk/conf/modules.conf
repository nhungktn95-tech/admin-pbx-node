; Nạp module cho pbx-node
[modules]
autoload = yes

; Kết nối database phải nạp TRƯỚC PJSIP/Queue, nếu không Asterisk không đọc được máy lẻ từ DB
preload => res_odbc.so
preload => res_config_odbc.so

; Tắt kênh SIP cũ (chan_sip) - dùng PJSIP, nếu không sẽ tranh cổng 5060
noload => chan_sip.so
; Chỉ dùng voicemail thường, tắt 2 bản ODBC/IMAP (bản ODBC cần bảng riêng)
noload => app_voicemail_odbc.so
noload => app_voicemail_imap.so
; Các module không dùng trong lab
noload => pbx_dundi.so
noload => cdr_odbc.so
noload => cel_odbc.so
noload => cdr_csv.so
noload => chan_iax2.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so
noload => pbx_gtkconsole.so
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so
noload => cdr_sqlite.so
noload => app_directory_odbc.so
noload => res_config_pgsql.so
; Tắt các module báo lỗi vì không có cấu hình (giảm log rác)
noload => res_config_ldap.so
noload => res_pjsip_geolocation.so
noload => res_geolocation.so
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => res_hep.so
noload => res_hep_rtcp.so
noload => res_hep_pjsip.so
noload => cel_tds.so
noload => cel_pgsql.so
noload => cel_radius.so
noload => cdr_radius.so
noload => cdr_tds.so
noload => cdr_pgsql.so
